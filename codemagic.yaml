workflows:
  ios-release:
    name: iOS Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      groups:
        - alertcontacts
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "com.alertcontacts.alertcontacts"
    scripts:
      - name: Fetch signing files from App Store Connect
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create \
            --certificate-key=@env:CERTIFICATE_PRIVATE_KEY

      - name: Set up keychain
        script: |
          keychain initialize

      - name: Add certificates to keychain
        script: |
          keychain add-certificates

      - name: Configure Xcode signing
        script: |
          xcode-project use-profiles

      - name: Create Secrets.xcconfig
        script: |
          echo "MAPS_API_KEY_IOS=$MAPS_API_KEY_IOS" > ios/Flutter/Secrets.xcconfig

      - name: Create .env
        script: |
          cat > .env << EOF
          # La variable sécurisée BASE_URL reste prioritaire. Ce repli évite
          # d'embarquer accidentellement une URL de développement dans une IPA.
          BASE_URL=${BASE_URL:-https://mobile.alertcontacts.net}
          GOOGLE_MAPS_API_KEY=$GOOGLE_MAPS_API_KEY
          EOF

      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Set iOS deployment target
        script: |
          find . -name "Podfile" -exec sed -i "s/^# platform :ios, '.*'/platform :ios, '15.0'/" {} \;
          find . -name "Podfile" -exec sed -i "s/^platform :ios, '.*'/platform :ios, '15.0'/" {} \;

      - name: Install CocoaPods dependencies
        script: |
          cd ios && pod install

      - name: Build iOS app ipa for release
        script: |
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist

      - name: Upload dSYMs to Firebase Crashlytics
        script: |
          UPLOAD_SYMBOLS=$(find ios/Pods -path "*/FirebaseCrashlytics/upload-symbols" 2>/dev/null | head -1)

          if [ -z "$UPLOAD_SYMBOLS" ]; then
            echo "⚠️ upload-symbols not found in ios/Pods, trying broader search..."
            UPLOAD_SYMBOLS=$(find . -path "*/FirebaseCrashlytics/upload-symbols" 2>/dev/null | head -1)
          fi

          if [ -z "$UPLOAD_SYMBOLS" ]; then
            echo "❌ upload-symbols introuvable, skip"
            exit 0
          fi

          echo "✅ upload-symbols trouvé : $UPLOAD_SYMBOLS"

          DSYM_DIR="build/ios/archive/Runner.xcarchive/dSYMs"

          if [ -z "$(ls -A $DSYM_DIR 2>/dev/null)" ]; then
            echo "❌ Aucun dSYM trouvé dans $DSYM_DIR"
            exit 0
          fi

          find "$DSYM_DIR" -name "*.dSYM" | while read dsym; do
            echo "📤 Upload : $dsym"
            "$UPLOAD_SYMBOLS" \
              -gsp ios/Runner/GoogleService-Info.plist \
              -p ios "$dsym"
          done

    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/archive/Runner.xcarchive/dSYMs/*.dSYM
      - build/ios/archive/**/*.dSYM

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
